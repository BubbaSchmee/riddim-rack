name: CI

permissions:
  contents: write

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Bundle
        run: cargo xtask bundle gts --release

      - name: Download pluginval
        shell: bash
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          unzip pluginval.zip -d pluginval

      - name: Validate with pluginval
        shell: bash
        run: |
          ./pluginval/pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --validate target/bundled/GTS.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: GTS-windows
          path: target/bundled/GTS.vst3

      - name: Zip release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.md target/bundled/
          cd target/bundled
          7z a -tzip GTS-windows.zip GTS.vst3 LICENSE THIRD-PARTY-NOTICES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/bundled/GTS-windows.zip
