[package]
name = "gts"
version = "0.1.0"
edition = "2021"
authors = ["Riddim Rack Open Source"]
license = "GPL-3.0-or-later"
description = "GTS, a two-oscillator grain table synthesizer VST3/CLAP instrument"
repository = "https://github.com/BubbaSchmee/riddim-rack"
homepage = "https://github.com/BubbaSchmee/riddim-rack"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
rr-ui = { path = "../rr-ui" }
rr-bus = { path = "../rr-bus" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Only for examples/plugin_loop.rs `zoom=`: needs the patched egui-baseview in docs/design/egui-baseview-zoom.patch.
zoom-patch = []

[dev-dependencies]
# Same pins as rr-ui's preview example: only the screenshot example needs a window.
eframe = { version = "=0.31.1" }
png = "0.17"
# plugin_loop example: the exact window/render path nih_plug_egui uses (same revs as Cargo.lock).
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0" }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0", features = ["opengl"] }
egui_glow = { version = "=0.31.1", default-features = false }
