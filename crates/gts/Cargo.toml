[package]
name = "gts"
version = "0.1.0"
edition = "2021"
authors = ["Riddim Rack Open Source"]
license = "GPL-3.0-or-later"
description = "GTS, a two-oscillator grain table synthesizer VST3/CLAP instrument"
repository = "https://github.com/BubbaSchmee/riddim-rack"
homepage = "https://github.com/BubbaSchmee/riddim-rack"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
rr-ui = { path = "../rr-ui" }
rr-bus = { path = "../rr-bus" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Text input inside hosts (SPEC v2 Track 6): nih_plug_egui does not pass this feature through, and
# features unify per package, so the same revision named here turns on egui-baseview's Windows
# keyboard-focus workaround for the plugin window (see docs/design/keyboard-in-host.md).
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0", default-features = false, features = ["windows_keyboard_workaround"] }
# The preset library asks the shell for the Documents known folder (follows OneDrive redirection).
# Same version Cargo.lock already carries.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[features]
# Only for examples/plugin_loop.rs `zoom=`: needs the patched egui-baseview in docs/design/egui-baseview-zoom.patch.
zoom-patch = []

[dev-dependencies]
# tests/matrix_alloc.rs: the allocator guard nih-plug installs in debug builds (same source, one crate).
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid", features = ["backtrace", "log"] }
# Same pins as rr-ui's preview example: only the screenshot example needs a window.
eframe = { version = "=0.31.1" }
png = "0.17"
# plugin_loop example: the exact window/render path nih_plug_egui uses (same revs as Cargo.lock).
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0" }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0", features = ["opengl"] }
egui_glow = { version = "=0.31.1", default-features = false }
# examples/support/typing.rs: the parent window handle (same version baseview and egui-baseview use).
raw-window-handle = "0.5"
