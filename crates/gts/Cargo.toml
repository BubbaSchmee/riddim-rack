[package]
name = "gts"
version = "0.1.0"
edition = "2021"
authors = ["Riddim Rack Open Source"]
license = "GPL-3.0-or-later"
description = "GTS, a two-oscillator graintable synthesizer VST3/CLAP instrument"
repository = "https://github.com/BubbaSchmee/riddim-rack"
homepage = "https://github.com/BubbaSchmee/riddim-rack"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
rr-ui = { path = "../rr-ui" }
rr-bus = { path = "../rr-bus" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Same pins as rr-ui's preview example: only the screenshot example needs a window.
eframe = { version = "=0.31.1" }
png = "0.17"
