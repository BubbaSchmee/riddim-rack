<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTS panel prototype v2</title>
<!-- Riddim Rack / GTS: animated panel prototype for owner approval. Self-contained: inline CSS, JS, canvas, SVG.
     Fonts (Barlow, JetBrains Mono, SIL OFL, from crates/rr-ui/assets/fonts) are embedded at the end of the file.
     URL switches for stills: ?t0=seconds &page=fx &mode=2d &osc=b &scope=spec &open=preset|patch &hover=<param id> &drag=<param id> &src=A|B|E|M &rm=1 &values=1 -->
<style>
/* ---- tokens: Variant B mint (docs/design/DESIGN.md) + new motion, depth and source roles ---- */
:root{
  --panel-top:#232a2e;--panel-bottom:#192024;--well:#11171a;--inset:#141b1e;--rail:#2a3236;--rail-slot:#0b1012;
  --text:#e6ece9;--muted:#93a19b;--title:#83918b;--accent:#5ee6a8;--accent-rgb:94,230,168;
  --track:#334046;--cap1:#273136;--cap2:#36434a;--led-off:#1b1b1e;--plate-text:#d8d5ce;
  --disp-top:#0f1214;--disp-bottom:#050607;--disp-caption:#7b868b;
  --hi:rgba(255,255,255,.07);--lo:rgba(0,0,0,.6);
  --src-a:#ffb454;--src-b:#7aa7ff;--src-e:#ff7a90;--src-m:#c792ff;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);
  --t-micro:100ms;--t-state:180ms;--t-panel:260ms;
  --sh-group:0 1px 0 rgba(255,255,255,.06),0 10px 18px -8px rgba(0,0,0,.6),0 2px 5px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080a0c;color:var(--text);font:500 11px/1 Barlow,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bar{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:18px;padding:0 20px;background:#0c1013;border-bottom:1px solid #1a2125;font:500 12px Barlow,sans-serif;color:#93a19b;z-index:5}
#bar b{font-weight:600;color:#d6dedb;letter-spacing:.06em}
#bar .sp{flex:1}
#bar label,#bar button.tb{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;padding:5px 10px;border-radius:5px;background:#12181b;border:1px solid #1f282c;color:#b5c1bc}
#bar button.tb:hover,#bar label:hover{background:#171f23;color:#e6ece9}
#bar input{accent-color:#5ee6a8}
#bar .st{font:400 11px "JetBrains Mono",monospace;color:#7b868b}
#vp{position:absolute;left:0;right:0;top:40px;bottom:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#10161a,#07090b 70%)}
#stage{position:absolute;left:0;top:0;width:1000px;height:832px;transform-origin:0 0;border-radius:8px;overflow:hidden;
  box-shadow:0 0 0 1px #000,0 30px 80px rgba(0,0,0,.65),0 6px 20px rgba(0,0,0,.5)}
#panel{position:absolute;inset:0;background:
  radial-gradient(ellipse 760px 420px at 34% -4%,rgba(255,255,255,.055),transparent 70%),
  radial-gradient(ellipse 520px 380px at 90% 108%,rgba(94,230,168,.025),transparent 70%),
  linear-gradient(180deg,var(--panel-top),var(--panel-bottom))}
#panel::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px #000,inset 0 1px 0 var(--hi)}
.rail{position:absolute;top:0;bottom:0;width:28px;background:linear-gradient(90deg,var(--rail),#1e2529);}
.rail.l{left:0;box-shadow:inset -1px 0 0 var(--lo),1px 0 0 rgba(255,255,255,.03)}
.rail.r{right:0;background:linear-gradient(270deg,var(--rail),#1e2529);box-shadow:inset 1px 0 0 var(--lo),-1px 0 0 rgba(255,255,255,.03)}
.rail::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.slot{position:absolute;width:10px;height:18px;border-radius:5px;background:var(--rail-slot);box-shadow:0 1px 0 var(--hi),inset 0 1px 2px rgba(0,0,0,.6)}
.rail.l .slot{left:8px}.rail.r .slot{right:8px}
.screw{position:absolute;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#36434a 0 4.5px,#273136 4.6px 7px,#000 7.1px);}
.screw::after{content:"";position:absolute;left:2.5px;right:2.5px;top:6.5px;height:2px;background:#050506;transform:rotate(var(--a));border-radius:1px}
/* ---- pages with staggered entrance ---- */
.page{position:absolute;inset:0;visibility:hidden}
.page.on,.page.leaving{visibility:visible}
.page .grp,.page .hero,.page .srcs{opacity:0;transform:translateY(8px);transition:none}
.page.on .grp,.page.on .hero,.page.on .srcs{opacity:1;transform:none;transition:opacity 120ms var(--ease-out) var(--d,0ms),transform 160ms var(--ease-out) var(--d,0ms)}
.page.leaving .grp,.page.leaving .hero,.page.leaving .srcs{opacity:0;transform:translateY(-4px);transition:opacity 60ms var(--ease-in),transform 60ms var(--ease-in)}
.rm .page .grp,.rm .page .hero,.rm .page .srcs{transition:none!important;transform:none!important}
.rm *,.still *{transition-duration:0ms!important;transition-delay:0ms!important;animation:none!important}
.still .page .grp,.still .page .hero,.still .page .srcs{transition:none!important}
/* ---- groups ---- */
.grp{position:absolute;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 36%),var(--well);box-shadow:var(--sh-group),inset 0 1px 0 var(--lo)}
.grp .gt{position:absolute;left:12px;right:12px;top:8px;height:24px;display:flex;align-items:center;gap:8px}
.gt .t{font:600 11px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--title);text-shadow:0 -1px 0 rgba(0,0,0,.4),0 1px 0 var(--hi);white-space:nowrap}
.gt .rule{flex:1;height:1px;min-width:6px;background:linear-gradient(90deg,rgba(255,255,255,.14),transparent)}
.gt .hc{display:flex;align-items:center;gap:8px}
.gb{position:absolute}
.grp.off>.gb{opacity:.45;transition:opacity var(--t-state) var(--ease-out)}
.grp>.gb{transition:opacity var(--t-state) var(--ease-out)}
/* ---- glass displays ---- */
.glass{position:absolute;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,var(--disp-top) 0,var(--disp-bottom) 40%,var(--disp-bottom));box-shadow:inset 0 0 0 1px #000,inset 0 8px 10px -6px rgba(0,0,0,.75),0 1px 0 var(--hi)}
.glass canvas,.hero canvas,.dcv{position:absolute}
.glass.small{border-radius:4px}
.glass .cap{position:absolute;font:500 11px/1 Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--disp-caption);pointer-events:none}
/* ---- knob ---- */
.knob{position:absolute;cursor:ns-resize;outline:none;touch-action:none;transition:opacity 140ms var(--ease-out)}
.kl{position:absolute;left:-2px;right:-2px;top:0;height:14px;font:500 11px/14px Barlow,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap;overflow:visible}
.kl .n,.kl .v{position:absolute;inset:0;transition:opacity 90ms}
.kl .v{opacity:0;font:400 11px/14px "JetBrains Mono",monospace;letter-spacing:0;color:var(--accent);text-transform:none}
.knob:hover .kl .n,.knob.drag .kl .n,.knob:focus-visible .kl .n{opacity:0}
.knob:hover .kl .v,.knob.drag .kl .v,.knob:focus-visible .kl .v{opacity:1}
.vals .knob .kl .n{opacity:0}.vals .knob .kl .v{opacity:1;color:var(--muted)}
.vals .knob:hover .kl .v,.vals .knob.drag .kl .v{color:var(--accent)}
.dial{position:absolute;border-radius:50%}.dial svg{display:block;overflow:visible}
.trk{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linecap:round}
.val{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.gl1,.gl2{stroke:var(--accent);stroke-linecap:round;opacity:0;transition:opacity var(--t-micro) var(--ease-out)}
.gl1{stroke-width:7}.gl2{stroke-width:11}
.knob:hover .gl1,.knob.drag .gl1,.knob:focus-visible .gl1{opacity:.18}
.knob:hover .gl2,.knob.drag .gl2,.knob:focus-visible .gl2{opacity:.06}
.ind{stroke:var(--text);stroke-width:2}
.knob:hover .ind,.knob.drag .ind{stroke:#fff}
.mod .mr{stroke:var(--sc);stroke-width:2;opacity:.5;stroke-linecap:round}
.mod .ml{stroke:var(--sc);stroke-width:2;opacity:.95;stroke-linecap:round}
.mod .mg{fill:var(--sc);opacity:.26}
.mod .md{fill:var(--sc);stroke:#0b0f11;stroke-width:1}
.knob.dim{opacity:.5}
.knob.hl .dial{border-radius:50%;box-shadow:0 0 0 3px var(--hc-a,rgba(255,255,255,.2)),0 0 14px var(--hc-a,rgba(255,255,255,.2))}
.knob.hl .mod .mr{opacity:.75}
.patching .knob{cursor:copy}
.patching .knob.target .dial{border-radius:50%;outline:1.5px dashed var(--pc);outline-offset:3px;animation:tgt 1.1s ease-in-out infinite}
.patching .knob.tgt-hot .dial{outline-style:solid;box-shadow:0 0 14px var(--pc-a);animation:none}
@keyframes tgt{50%{outline-offset:5px;outline-color:transparent}}
/* ---- toggle / combo ---- */
.tog,.cmb{height:24px;border-radius:4px;background:var(--inset);box-shadow:inset 0 1px 0 var(--lo),0 1px 0 var(--hi);display:flex;align-items:center;cursor:pointer;user-select:none;outline:none;transition:background var(--t-micro) var(--ease-out),box-shadow var(--t-micro)}
.tog:hover,.cmb:hover{background:#192226}
.tog:focus-visible,.cmb:focus-visible,.knob:focus-visible .dial{box-shadow:inset 0 1px 0 var(--lo),0 0 0 1.5px rgba(94,230,168,.55)}
.tog{padding:0 8px;gap:8px;color:var(--muted);white-space:nowrap}
.tog.bare{padding:0;width:24px;justify-content:center}
.tog .tl{font:500 11px Barlow,sans-serif;letter-spacing:.05em;text-transform:uppercase;transition:color var(--t-state)}
.tog .led{width:8px;height:8px;border-radius:50%;background:var(--led-off);box-shadow:0 0 0 1px #000;transition:background var(--t-state) var(--ease-out),box-shadow var(--t-state) var(--ease-out);flex:none}
.tog.on{color:var(--text)}
.tog.on .led{background:var(--accent);box-shadow:0 0 0 1px rgba(94,230,168,.4),0 0 7px 1px rgba(94,230,168,.30)}
.cmb{padding:0 8px;justify-content:space-between;gap:6px}
.cmb .ct{font:500 13px Barlow,sans-serif;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmb .chev{color:var(--muted);display:flex;flex:none;transition:transform var(--t-state) var(--ease-out)}
.cmb.opened .chev{transform:rotate(180deg)}
.cmbw{display:flex;flex-direction:column;gap:2px}
.cmbw .kl{position:static;height:14px;left:auto}
.grp.off .tog.keep,.grp.off .cmb.keep{opacity:1}
/* ---- menu + popup + tooltip ---- */
#overlay{position:absolute;inset:0;pointer-events:none;z-index:20}
#overlay>*{pointer-events:auto}
.menu{position:absolute;background:#0f1518;border-radius:5px;box-shadow:0 0 0 1px #000,0 14px 28px -6px rgba(0,0,0,.7),inset 0 1px 0 var(--hi);padding:4px 0;overflow-y:auto;opacity:0;transform:translateY(-4px);transition:opacity 90ms var(--ease-in),transform 90ms var(--ease-in);scrollbar-width:thin;scrollbar-color:#2a3236 transparent}
.menu.open{opacity:1;transform:none;transition:opacity 130ms var(--ease-out),transform 130ms var(--ease-out)}
.mi{height:24px;line-height:24px;padding:0 12px;font:500 13px/24px Barlow,sans-serif;color:var(--text);cursor:pointer;display:flex;justify-content:space-between;gap:18px;white-space:nowrap}
.mi em{font:500 11px/24px Barlow,sans-serif;color:var(--muted);font-style:normal;letter-spacing:.06em;text-transform:uppercase}
.mi:hover{background:rgba(94,230,168,.16)}
.mi.sel{color:var(--accent)}
.pop{position:absolute;transform:translate(-50%,-100%) translateY(4px);padding:5px 9px;border-radius:5px;background:#0b0f11;box-shadow:0 0 0 1px rgba(94,230,168,.35),0 8px 18px rgba(0,0,0,.55);font:400 12px/14px "JetBrains Mono",monospace;color:var(--text);opacity:0;pointer-events:none!important;white-space:nowrap;transition:opacity 120ms var(--ease-out),transform 120ms var(--ease-out);z-index:30}
.pop.on{opacity:1;transform:translate(-50%,-100%)}
.pop::after{content:"";position:absolute;left:50%;bottom:-4px;width:7px;height:7px;background:#0b0f11;transform:translateX(-50%) rotate(45deg);box-shadow:1px 1px 0 rgba(94,230,168,.35)}
/* ---- header ---- */
.plate{position:absolute;border-radius:6px;background:linear-gradient(180deg,#1c2327,#131a1d);box-shadow:var(--sh-group),inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 0 var(--hi)}
.np .nn{position:absolute;left:14px;top:5px;font:600 28px/32px Barlow,sans-serif;letter-spacing:.22em;color:var(--plate-text);text-shadow:0 -1px 0 rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.08)}
.np .nd{position:absolute;left:15px;top:38px;font:500 11px/12px Barlow,sans-serif;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.np .nl{position:absolute;right:12px;top:11px;display:flex;align-items:center;gap:6px;font:400 12px "JetBrains Mono",monospace;color:var(--muted)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--led-off);box-shadow:0 0 0 1px #000}
.led.on{background:var(--accent);box-shadow:0 0 0 1px rgba(94,230,168,.4),0 0 7px 1px rgba(94,230,168,.30)}
.pb{display:flex;align-items:stretch}
.pb .ar{width:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border-radius:6px;transition:background var(--t-micro),color var(--t-micro)}
.pb .ar:hover{background:rgba(255,255,255,.05);color:var(--text)}
.pb .ar:active{background:rgba(94,230,168,.12);color:var(--accent)}
.pb .nm{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;cursor:pointer;border-radius:6px;min-width:0}
.pb .nm:hover{background:rgba(255,255,255,.035)}
.pb .nm small{font:500 11px/12px Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pb .nm b{font:600 17px/20px Barlow,sans-serif;color:var(--text);white-space:nowrap;display:flex;gap:6px;align-items:center}
.pb .nm b i{font-style:normal;color:var(--accent);font-weight:600}
.pb .nm .tick{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);opacity:0;transition:opacity var(--t-state)}
.pb .nm.dirty .tick{opacity:1}
.seg{display:flex;height:26px;padding:2px;gap:2px;border-radius:4px;background:var(--inset);box-shadow:inset 0 1px 0 var(--lo),0 1px 0 var(--hi);position:relative}
.seg .sl{position:absolute;top:2px;bottom:2px;left:2px;border-radius:3px;background:rgba(94,230,168,.2);box-shadow:inset 0 0 0 1px rgba(94,230,168,.55);transition:transform var(--t-state) var(--ease-out),width var(--t-state) var(--ease-out)}
.seg b{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;font:600 11px Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-radius:3px;transition:color var(--t-micro),background var(--t-micro)}
.seg b:hover{color:var(--text);background:rgba(255,255,255,.04)}
.seg b.on{color:var(--accent);background:none}
.seg.mini{height:22px}.seg.mini b{padding:0 9px;font-size:11px}
.chip-patch{display:flex;align-items:center;justify-content:center;gap:5px;height:24px;padding:0 8px;border-radius:4px;background:var(--inset);box-shadow:inset 0 1px 0 var(--lo),0 1px 0 var(--hi);cursor:pointer;color:var(--muted);font:600 11px Barlow,sans-serif;letter-spacing:.12em;transition:background var(--t-micro),color var(--t-micro)}
.chip-patch:hover{background:#192226;color:var(--text)}
.chip-patch.opened{color:var(--accent);box-shadow:inset 0 1px 0 var(--lo),0 0 0 1px rgba(94,230,168,.4)}
.chip-patch i{width:6px;height:6px;border-radius:50%;background:var(--led-off);box-shadow:0 0 0 1px #000}
.qcmb{height:24px;padding:0 6px}
.scopew .tabs{position:absolute;right:8px;top:6px;display:flex;gap:2px;font:600 11px/12px Barlow,sans-serif;letter-spacing:.1em;z-index:2}
.scopew .tabs span{padding:2px 5px;border-radius:3px;color:#7b868b;cursor:pointer;transition:color var(--t-micro),background var(--t-micro)}
.scopew .tabs span:hover{color:#e6ece9}.scopew .tabs span.on{color:var(--accent)}
.scopew{cursor:pointer}
/* ---- hero ---- */
.hero{position:absolute;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#0b0e11 0,#06080a 40%,#06080a);box-shadow:var(--sh-group),inset 0 0 0 1px #000,inset 0 10px 14px -8px rgba(0,0,0,.8);cursor:ew-resize}
.hero::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);pointer-events:none}
.hero .hv-t{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:12px;pointer-events:none}
.hero .hv-t .seg{pointer-events:auto}
.hero .hv-n small,.hero .hv-i small{display:block;font:500 11px/12px Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--disp-caption);margin-bottom:3px}
.hero .hv-n span{font:600 17px/19px Barlow,sans-serif;color:var(--text);letter-spacing:.02em}
.hero .hv-i{position:absolute;right:16px;top:10px;text-align:right;pointer-events:none}
.hero .hv-i span{display:block;font:400 26px/28px "JetBrains Mono",monospace;color:var(--accent);letter-spacing:-.01em;text-shadow:0 0 12px rgba(94,230,168,.3)}
.hero .hv-i em{display:block;margin-top:2px;font:400 11px/12px "JetBrains Mono",monospace;color:#7b868b;font-style:normal}
.hero .hv-b{position:absolute;left:14px;right:14px;bottom:10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.hero .hv-b .seg{pointer-events:auto}
.hero .hv-b .hint{font:500 11px Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#7b868b}
.hero .hv-b .hint i{font-style:normal;color:#ffb454}
/* ---- sources strip ---- */
.srcs{position:absolute;display:flex;align-items:center;gap:8px;height:20px}
.srcs .cp{font:600 11px Barlow,sans-serif;letter-spacing:.14em;color:var(--title);text-transform:uppercase;margin-right:2px;text-shadow:0 -1px 0 rgba(0,0,0,.4),0 1px 0 var(--hi)}
.chip{white-space:nowrap;position:relative;display:flex;align-items:center;gap:7px;height:20px;padding:0 9px 0 3px;border-radius:10px;background:var(--inset);box-shadow:inset 0 0 0 1px rgba(var(--rgb),.35),0 1px 0 var(--hi);cursor:grab;user-select:none;touch-action:none;font:600 11px Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text);transition:background var(--t-micro),box-shadow var(--t-micro)}
.chip:hover{background:#192226;box-shadow:inset 0 0 0 1px rgba(var(--rgb),.8),0 0 12px rgba(var(--rgb),.18)}
.chip .gl{width:14px;height:14px;border-radius:50%;background:var(--c);color:#0b0f11;display:flex;align-items:center;justify-content:center;font:700 10px/1 Barlow,sans-serif;letter-spacing:0}
.chip .ac{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.chip .ac i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--c);transform-origin:0 50%;transform:scaleX(.1)}
.srcs .hint{white-space:nowrap;margin-left:auto;font:500 11px Barlow,sans-serif;letter-spacing:.06em;color:#7b868b}
.ghost{position:absolute;z-index:40;pointer-events:none!important;transform:translate(-50%,-130%);box-shadow:0 8px 18px rgba(0,0,0,.5),inset 0 0 0 1px rgba(var(--rgb),.9)}
/* ---- patch popover ---- */
#patch{position:absolute;width:312px;height:146px;opacity:0;transform:translateY(-6px) scale(.985);transform-origin:90% 0;pointer-events:none;transition:opacity 90ms var(--ease-in),transform 90ms var(--ease-in);z-index:25}
#patch.on{opacity:1;transform:none;pointer-events:auto;transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out)}
#patch .grp{opacity:1;transform:none;inset:0;width:100%;height:100%;background:#0f1518;box-shadow:0 0 0 1px #000,0 18px 36px -8px rgba(0,0,0,.75),inset 0 1px 0 var(--hi)}
#patch input{width:104px;height:24px;border-radius:4px;background:var(--inset);border:0;box-shadow:inset 0 1px 0 var(--lo),0 1px 0 var(--hi);padding:0 8px;font:400 12px "JetBrains Mono",monospace;color:var(--text);outline:none}
#patch input:focus{box-shadow:inset 0 1px 0 var(--lo),0 0 0 1.5px rgba(94,230,168,.5)}
.prow{position:absolute;left:0;right:0;height:24px;display:flex;align-items:center;gap:6px}
.prow .cmb{height:24px}
.prow .cmb .ct{font-size:12px}
.prow.lost .cmb:first-child .ct{color:rgba(147,161,155,.75)}
.prow.lost{opacity:.6}
.prow .pk{position:relative;width:24px;height:24px;flex:none}
.prow .pl{width:12px;height:12px;display:flex;align-items:center;justify-content:center}
.prow .pl i{width:8px;height:8px;border-radius:50%;background:var(--led-off);box-shadow:0 0 0 1px #000}
/* ---- help line ---- */
